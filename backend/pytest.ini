[pytest]
# Pytest Configuration for GoingMerry-Stonks Backend

# Test discovery patterns
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Minimum code coverage requirement (fail if below)
addopts =
    --strict-markers
    --cov=app
    --cov-report=term-missing
    --cov-report=html
    --cov-report=xml
    --cov-fail-under=54
    --maxfail=5
    --tb=short
    --asyncio-mode=auto
    -v

# Markers for categorizing tests
markers =
    unit: Unit tests (fast, isolated)
    integration: Integration tests (database, external APIs)
    slow: Slow running tests
    security: Security-focused tests
    smoke: Basic smoke tests for deployment validation

# Coverage settings
[coverage:run]
source = app
omit =
    */tests/*
    */test_*.py
    */__init__.py
    */conftest.py
    */financial_models/options_pricing.py

[coverage:report]
precision = 2
show_missing = True
skip_covered = False

exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod
